name: Focused portable validation

on:
  workflow_dispatch:
  push:
    branches:
      - standalone/integration
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/check_source_size.py'
      - '.github/workflows/focused-portable.yml'

concurrency:
  group: focused-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nr-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure focused portable validation
        run: >
          cmake -S . -B build-focused
          -DCMAKE_BUILD_TYPE=Release
          -DNRFUSION_FOCUSED_NR_SESSION_VALIDATION=ON

      - name: Build focused validation targets
        run: >
          cmake --build build-focused
          --target nrfusion_nr_session_tests nrfusion_nr_session_stress_tests nrfusion_tests
          nrfusion_nr_timing_source_tests nrfusion_d3d11_bridge_slot_tracker_tests
          nrfusion_d3d11_carrier_work_tests
          nrfusion_d3d10_carrier_route_tests
          nrfusion_d3d9_carrier_route_tests
          nrfusion_d3d12_carrier_contract_tests nrfusion_d3d12_carrier_session_tests
          nrfusion_d3d12_carrier_native_facts_tests nrfusion_d3d12_carrier_capabilities_tests
          nrfusion_d3d12_carrier_bootstrap_tests
          nrfusion_d3d12_carrier_work_tests nrfusion_d3d12_carrier_execution_plan_tests
          nrfusion_d3d12_guide_format_tests nrfusion_d3d12_nr_frame_plan_tests
          nrfusion_vulkan_carrier_contract_tests
          nrfusion_vulkan_carrier_acquire_tests
          nrfusion_vulkan_carrier_session_tests
          nrfusion_vulkan_carrier_execution_plan_tests
          nrfusion_opengl_carrier_acquire_tests
          nrfusion_opengl_carrier_sync_tests
          nrfusion_provider_policy_opengl_tests
          --parallel 2

      - name: Run focused regression tests
        run: >
          ctest --test-dir build-focused
          --output-on-failure
          -R '^(nrfusion_tests|nrfusion_nr_(session_(tests|stress_tests)|timing_source_tests)|nrfusion_d3d11_bridge_slot_tracker_tests|nrfusion_d3d11_carrier_work_tests|nrfusion_d3d10_carrier_route_tests|nrfusion_d3d9_carrier_route_tests|nrfusion_d3d12_(carrier_(contract|session|native_facts|capabilities|bootstrap|work|execution_plan)|guide_format|nr_frame_plan)_tests|nrfusion_vulkan_carrier_(contract|acquire|session|execution_plan)_tests|nrfusion_opengl_carrier_(acquire|sync)_tests|nrfusion_provider_policy_opengl_tests)'

      - name: Check changed source size
        run: python tools/check_source_size.py changed

      - name: Package source checkpoint
        run: git archive --format=zip --output=nrfusion-source-${GITHUB_SHA}.zip HEAD

      - name: Upload source checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: nrfusion-source-${{ github.sha }}
          path: nrfusion-source-${{ github.sha }}.zip
          if-no-files-found: error
