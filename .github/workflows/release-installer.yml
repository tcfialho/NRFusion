name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --no-progress -y

      - name: Build NRFusion and Compile Installer
        shell: powershell
        run: |
          ./tools/build_dist.ps1 -AutoFetchRuntime -CompileInstaller

      - name: Package Installer to ZIP
        id: package
        shell: powershell
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v0.5.4" }
          $zipName = "NRFusion-$tag-Setup.zip"
          Compress-Archive -Path dist\NRFusionSetup.exe -DestinationPath "dist\$zipName" -CompressionLevel Optimal
          Write-Host "Created dist\$zipName"
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: NRFusion-Installer-Package
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release and Upload ZIP
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.ZIP_NAME }}
            dist/SHA256SUMS.txt
          generate_release_notes: true
