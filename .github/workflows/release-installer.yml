name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --no-progress -y

      - name: Build NRFusion and Compile Installer
        shell: powershell
        run: |
          ./tools/build_dist.ps1 -AutoFetchRuntime -CompileInstaller

      - name: Package Installer to ZIP
        id: package
        shell: powershell
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev" }
          $zipName = "NRFusion-$tag-Setup.zip"
          $zipPath = Join-Path "dist" $zipName
          $installer = "dist\NRFusionSetup.exe"

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "NSIS installer was not produced: $installer"
          }

          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive -LiteralPath $installer -DestinationPath $zipPath -CompressionLevel Optimal

          $verifyDir = Join-Path $env:RUNNER_TEMP "nrfusion-release-zip"
          if (Test-Path -LiteralPath $verifyDir) {
            Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir

          $files = @(Get-ChildItem -LiteralPath $verifyDir -Recurse -File)
          if ($files.Count -ne 1) {
            throw "Release ZIP must contain exactly one file, found $($files.Count)."
          }

          $relative = [IO.Path]::GetRelativePath($verifyDir, $files[0].FullName)
          if ($relative -ne "NRFusionSetup.exe") {
            throw "Release ZIP contains unexpected path: $relative"
          }

          Write-Host "Release asset ready: $zipPath"
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}
          generate_release_notes: true
