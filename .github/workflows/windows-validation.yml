name: Windows validation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full
      targets:
        description: Comma-separated CMake targets for fast mode
        required: false
        default: nrfusion_core
        type: string
      test_regex:
        description: Optional CTest regex for fast mode
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NSIS
        if: inputs.scope == 'full'
        shell: powershell
        run: choco install nsis --no-progress -y

      - name: Validate Windows
        shell: powershell
        run: |
          if ("${{ inputs.scope }}" -eq "fast") {
            ./tools/validate_windows.ps1 -Fast -TargetsCsv "${{ inputs.targets }}" -TestRegex "${{ inputs.test_regex }}"
          } else {
            ./tools/validate_windows.ps1
          }

      - name: Upload public developer dist
        if: inputs.scope == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: NRFusion-windows-developer-dist
          path: |
            dist/**
            .build/installer-validation/**
          if-no-files-found: error
