name: Windows validation

on:
  push:
    branches:
      - standalone/integration
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/validate_windows.ps1'
      - '.github/workflows/windows-validation.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full
      targets:
        description: Comma-separated CMake targets for fast mode
        required: false
        default: nrfusion_core
        type: string
      test_regex:
        description: Optional CTest regex for fast mode
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NSIS
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        shell: powershell
        run: choco install nsis --no-progress -y

      - name: Validate Windows
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            ./tools/validate_windows.ps1 -Fast `
              -TargetsCsv "nrfusion_core,nrfusion_synthetic_dx11_bridge_test" `
              -TestRegex "^nrfusion_synthetic_dx11_bridge_test$"
          } elseif ("${{ inputs.scope }}" -eq "fast") {
            ./tools/validate_windows.ps1 -Fast `
              -TargetsCsv "${{ inputs.targets }}" `
              -TestRegex "${{ inputs.test_regex }}"
          } else {
            ./tools/validate_windows.ps1
          }

      - name: Upload public developer dist
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: NRFusion-windows-developer-dist
          path: |
            dist/**
            .build/installer-validation/**
          if-no-files-found: error
