name: Windows validation

on:
  push:
    branches:
      - standalone/integration
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/validate_windows.ps1'
      - 'tools/validate_phase09_hardware.ps1'
      - 'tools/validate_phase10_hardware.ps1'
      - 'tools/validate_phase11_hardware.ps1'
      - '.github/workflows/windows-validation.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full
      targets:
        description: Comma-separated CMake targets for fast mode
        required: false
        default: nrfusion_core
        type: string
      test_regex:
        description: Optional CTest regex for fast mode
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout official Vulkan headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.3.296
          path: .deps/Vulkan-Headers
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Vulkan headers
        shell: powershell
        run: |
          "NRFUSION_VULKAN_HEADERS=$PWD\.deps\Vulkan-Headers\include" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NSIS
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        shell: powershell
        run: choco install nsis --no-progress -y

      - name: Parse physical gate scripts
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          @(
            'tools/validate_phase09_hardware.ps1',
            'tools/validate_phase10_hardware.ps1',
            'tools/validate_phase11_hardware.ps1'
          ) | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $_),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Validate Windows
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            ./tools/validate_windows.ps1 -Fast `
              -TargetsCsv "nrfusion_d3d11_carrier_hook_tests,nrfusion_d3d11_carrier_native_acquire_tests,nrfusion_synthetic_dx11_bridge_test,nrfusion_capture32,nrfusion_ipc_host_compile,nrfusion_ipc_generation_contract_tests,nrfusion_capture32_transport_timeout_tests,nrfusion_vulkan_provider_compile,nrfusion_vulkan_native_compile,nrfusion_vulkan_native_device_tests,nrfusion_vulkan_carrier_executor_tests,nrfusion_vulkan_carrier_device_tests,nrfusion_d3d12_external_share_tests,nrfusion_vulkan_external_interop_tests" `
              -TestRegex "^(nrfusion_d3d11_carrier_native_acquire_tests|nrfusion_synthetic_dx11_bridge_test|nrfusion_ipc_generation_contract_tests|nrfusion_capture32_transport_timeout_tests|nrfusion_vulkan_native_device_tests|nrfusion_vulkan_carrier_executor_tests|nrfusion_vulkan_carrier_device_tests|nrfusion_d3d12_external_share_tests|nrfusion_vulkan_external_interop_tests)$"
          } elseif ("${{ inputs.scope }}" -eq "fast") {
            ./tools/validate_windows.ps1 -Fast `
              -TargetsCsv "${{ inputs.targets }}" `
              -TestRegex "${{ inputs.test_regex }}"
          } else {
            ./tools/validate_windows.ps1
          }

      - name: Upload public developer dist
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: NRFusion-windows-developer-dist
          path: |
            dist/**
            .build/installer-validation/**
          if-no-files-found: error
